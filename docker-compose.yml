services:
  db:
    image: postgres:15-alpine
    container_name: biblioteca_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: biblioteca_api_production
      
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: biblioteca_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  mailpit:
    image: axllent/mailpit
    container_name: biblioteca_mailpit
    ports:
      - "1025:1025" 
      - "8025:8025" 

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_backend
    environment:
      - REDIS_URL=redis://biblioteca_redis:6379/1
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - RAILS_SERVE_STATIC_FILES=true
      - DEVISE_JWT_SECRET_KEY=${DEVISE_JWT_SECRET_KEY}
      - SMTP_USERNAME=${MAILTRAP_USER}
      - SMTP_PASSWORD=${MAILTRAP_PASSWORD}
    ports:
      - "3000:80" 
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./biblioteca_front
      dockerfile: Dockerfile
    container_name: biblioteca_frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pg_data:
  redis_data: